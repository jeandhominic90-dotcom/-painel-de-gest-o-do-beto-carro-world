<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Família</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-setor="familia">

    <header>
        <h1>Setor Família</h1>
    </header>

    <main class="main-layout">
        <section class="card">
            <h2>Leitura de código de barras</h2>
            <form id="form-codigo-barra">
                <div class="form-group">
                    <input type="text" inputmode="numeric" id="codigo-barra" placeholder="digite ou escaneie o código de barras" autocomplete="off">
                </div>
                <button type="submit" class="btn-black">Buscar</button>
            </form>
            <div id="resultado-setor" class="resultado-setor"></div>
            <p><a href="index.html">Voltar ao painel</a></p>
        </section>
    </main>

    <script src="./src/setor.js"></script>
</body>

</html>
