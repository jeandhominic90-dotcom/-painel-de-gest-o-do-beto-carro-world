<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoológico</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-setor="zoologico">

    <header>
        <h1>Setor</h1>
    </header>

    <main class="main-layout">
        <section class="card">
            <h2>Leitura de código de barras</h2>
            <div id="form-codigo-barra">
                <div class="form-group">
                    <input type="text" inputmode="numeric" id="codigo-barra"
                        placeholder="digite ou escaneie o código de barras" autocomplete="off">
                </div>
                <button onclick="buscar_cliente()" class="btn-black">Buscar</button>
            </div>
            <div id="resultado-setor" class="resultado-setor"></div>
            <a href="index.html" class="btn-black btn-voltar">Voltar ao painel</a>
        </section>
    </main>

    <div class="form-group" >
        <select id="categoria-produto" required class="input-select"
            style="width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; font-size: 0.9rem; background: #fff;">
            <option value="" disabled selected>Selecione a Atrações</option>
            
    </select>
    </div>

    <script src="./src/setor.js"></script>
</body>

</html>
